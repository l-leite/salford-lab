<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salford Studio</title>
<style>
  :root { --bg:#fafaf8; --fg:#1c1c1a; --muted:#6b6b66; --line:#dcdcd6; --accent:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
  main { max-width:40rem; margin:0 auto; padding:4rem 16px; }
  h1 { font-size:1.8rem; margin:0 0 .25rem; }
  p.sub { color:var(--muted); margin:0 0 2.5rem; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li { border-bottom:1px solid var(--line); }
  a { display:flex; justify-content:space-between; align-items:baseline; gap:1rem; padding:1rem 0; color:inherit; text-decoration:none; }
  a:hover .t { color:var(--accent); }
  .main { display:flex; flex-direction:column; min-width:0; }
  .u { color:var(--muted); font-size:.85rem; font-family:ui-monospace,Consolas,monospace; }
  time { color:var(--muted); font-size:.9rem; white-space:nowrap; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <main>
    <h1>Salford Studio</h1>
    <p class="sub">Guidance and resources</p>
    <ul>
      <li><a href="portfolio-guidance/"><span class="main"><span class="t">DS2A Portfolio Notes</span><span class="u">/portfolio-guidance</span></span><time datetime="2026-10-13">13 Oct 2026</time></a></li>
    </ul>
  </main>
</body>
</html>
